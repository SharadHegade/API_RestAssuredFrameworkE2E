
name: API Test Framework RestAssured E2E

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Runs twice: daily at 6 PM UTC/11.30IST and 3 AM UTC
    - cron: '0 18 * * *'     # Daily at 6 PM UTC/ 11:30 PM IST ( * * * indicates,every single month,date,day
    - cron: '0 3 * * *'  # Monday and Thursday at 3 AM UTC/ 8.30 AP IST

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Execute Tests
      run: mvn clean test -Dsuite=suite -X

    - name: Upload a Build Artifact
      if: always()  # Tests fail or pass, LOGS should be archived
      uses: actions/upload-artifact@v6.0.0
      with:
       name: Logs
       path: logs/

    - name: Publish Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: TestNG Results
        path: target/surefire-reports/junitreports/TEST-*.xml
        reporter: java-junit   
